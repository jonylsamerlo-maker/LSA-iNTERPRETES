services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000

  api:
    image: clue/json-server
    ports:
      - "3000:80"
    volumes:
      - ./api-mock/db.json:/data/db.json
